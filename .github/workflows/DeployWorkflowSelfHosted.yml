name: Deploy vulnerablelightapp on self-hosted runner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Stop and remove the previous container
    - name: Stop and remove previous container
      run: |
        sudo docker stop vulnerablelightapp || true
        sudo docker rm vulnerablelightapp || true

    # Remove the old Docker image
    - name: Remove old Docker image
      run: |
        sudo docker rmi vulnerablelightapp:latest || true

    # Build the new Docker image
    - name: Build Docker image
      run: sudo docker build -t vulnerablelightapp:latest .

    # Run the new container
    - name: Run the new Docker container
      run: |
        sudo docker run -d --name vulnerablelightapp -p 3000:3000 vulnerablelightapp:latest

    # Wait for the container to start
    - name: Wait for the container to start
      run: sleep 66

    # Test the application
    - name: Test the application
      run: curl -k https://127.0.0.1:3000
